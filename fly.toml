app = "REDACTED"
kill_signal = "SIGINT"
kill_timeout = "5s"
primary_region = "sin"

[build]
image = "ghcr.io/webees/vaultwarden@sha256:33f496bdef01e0a5652d67f2dbec28c431f38470d1cef6825426ae54e2cc5073"

[checks.health]
grace_period = "60s"
interval = "15s"
method = "get"
path = "/alive"
port = 80
timeout = "10s"
type = "http"

[http_service]
force_https = true
internal_port = 80
min_machines_running = 1

  # Each Vaultwarden client holds a WebSocket for live sync, so the default
  # connection limit is easy to hit; make the headroom explicit.
  [http_service.concurrency]
  type = "connections"
  soft_limit = 80
  hard_limit = 100

[[mounts]]
destination = "/data"
source = "app_data"
