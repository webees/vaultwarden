app = "xvx-vaultwarden"
kill_signal = "SIGINT"
kill_timeout = "5s"
primary_region = "sin"

[build]
image = "ghcr.io/webees/vaultwarden@sha256:ab4987cbfd91883319f2b04732e5af7269e16bd13e7d2b60a8895400d4e95f87"

[checks.health]
grace_period = "60s"
interval = "15s"
method = "get"
path = "/alive"
port = 80
timeout = "10s"
type = "http"

[http_service]
force_https = true
internal_port = 80
min_machines_running = 1

  # Each Vaultwarden client holds a WebSocket for live sync, so the default
  # connection limit is easy to hit; make the headroom explicit.
  [http_service.concurrency]
  type = "connections"
  soft_limit = 80
  hard_limit = 100

[[mounts]]
destination = "/data"
source = "app_data"
