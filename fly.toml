app = "REDACTED"
kill_signal = "SIGINT"
kill_timeout = "5s"
primary_region = "sin"

# No [build].image on purpose: two sources of truth for "what is running" is how
# fly.toml silently went stale. The deploy workflow passes the exact digest the
# build workflow just published with --image; running `fly deploy` by hand builds
# this repository's pinned Dockerfile locally instead.

# Fly probes /alive through Caddy. If the proxy stops answering, the machine is
# taken out of service instead of silently black-holing requests.
[checks.health]
grace_period = "60s"
interval = "15s"
method = "get"
path = "/alive"
port = 8080
timeout = "10s"
type = "http"

[http_service]
  # Vaultwarden has no "cold start": every client is a syncing WebSocket, so the
  # machine must stay up even when it looks idle.
  auto_stop_machines = false
force_https = true
internal_port = 8080
min_machines_running = 1

  # Each Vaultwarden client holds a WebSocket for live sync, so the default
  # connection limit is easy to hit; make the headroom explicit.
  [http_service.concurrency]
  type = "connections"
  soft_limit = 80
  hard_limit = 100

[[mounts]]
destination = "/data"
source = "app_data"
