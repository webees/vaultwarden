name: Rotate Fly Token

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rotate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Inspect token caveats
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}
        run: |
          set -euo pipefail
          : "${FLY_API_TOKEN:?repository secret FLY_API_TOKEN must hold a Fly token}"
          : "${FLY_APP:?repository secret FLY_APP must hold the Fly app name}"
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          timeout 30 flyctl tokens debug -t "$FLY_API_TOKEN" >"$work/token.json"
          timeout 30 flyctl status --app "$FLY_APP" --json >"$work/status.json"
          jq '{
            macaroons: length,
            caveat_types: [.[].caveats[]?.type],
            caveat_body_types: [.[].caveats[]?.body | type],
            caveat_body_keys: [.[].caveats[]?.body | select(type == "object") | keys]
          }' "$work/token.json"
          jq '{status_ok:true, machine_count:(.Machines|length), has_app_name:(.Name != null)}' "$work/status.json"
