# Named for what it does, not for the registry it pushes to: this workflow
# builds the multi-arch image, publishes it and rolls that digest out to Fly.
name: 🐳 Build and Deploy

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    tags: [ '*' ]
    # fly.toml is a production input: it carries the machine config that only
    # `flyctl deploy` applies. Ignoring it here meant a config-only commit built
    # nothing and deployed nothing, so the change silently never reached Fly.
    #
    # Everything else in this list cannot reach the image: `.dockerignore` keeps
    # these paths out of the build context. Without them every `.github`-only or
    # tests-only commit rebuilt both architectures and rolled production anyway.
    # `.gitignore` counts too: it is excluded from the build context, yet the
    # smoke-suite commit on 2026-10-19T04:23Z rebuilt and redeployed through it.
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - .github/**
      - tests/**
  schedule:
    # Weekly rebuild keeps Alpine package (caddy/restic/sqlite) security fixes
    # flowing. Minute 23, not 0: GitHub queues scheduled runs behind the hourly
    # load spike, so the top of the hour is the slowest slot to pick.
    - cron: '23 4 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  # Shared with ghcr-cleanup.yml: both workflows mutate the same package, and a
  # cleanup racing an in-flight multi-arch push can delete partial manifests.
  group: ghcr-registry
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, so the workflow token does not belong in
          # .git/config where a later step could reuse it.
          persist-credentials: false

      - name: 🌐 Refresh Cloudflare IP ranges
        run: scripts/refresh-cloudflare-ips.sh

      - name: 🧹 Invalidate package layer cache
        id: cache-bust
        run: |
          # apk only pulls patched packages when this layer is rebuilt, so give
          # every scheduled run a unique cache key for the dependency layer.
          echo "cache-bust=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: ⚙️ Enable QEMU for cross-platform builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container
          use: true

      - name: 🔐 Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🕒 Compute image timestamp
        id: timestamp
        run: |
          value="$(TZ=Asia/Shanghai date +%Y%m%d%H%M)"
          echo "value=${value}" >> "$GITHUB_OUTPUT"
          echo "Image timestamp: ${value}"

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.timestamp.outputs.value }},enable=true
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=tag

      - name: ✅ Verify timestamp tag
        env:
          TIMESTAMP_TAG: ${{ steps.timestamp.outputs.value }}
          METADATA_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          expected="${REGISTRY}/${IMAGE_NAME}:${TIMESTAMP_TAG}"
          if ! grep -Fxq "$expected" <<< "$METADATA_TAGS"; then
            echo "Missing timestamp tag: ${expected}" >&2
            echo "$METADATA_TAGS" >&2
            exit 1
          fi
          echo "Timestamp tag verified: ${expected}"

      - name: 🚀 Build and push Docker image (Multi-Arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          build-args: |
            CACHE_BUST=${{ steps.cache-bust.outputs.cache-bust }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🧾 Record the published amd64 digest
        id: digest
        env:
          TIMESTAMP_TAG: ${{ steps.timestamp.outputs.value }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${TIMESTAMP_TAG}" \
            --format '{{range .Manifest.Manifests}}{{if eq .Platform.Architecture "amd64"}}{{.Digest}}{{end}}{{end}}')"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published ${REGISTRY}/${IMAGE_NAME}:${TIMESTAMP_TAG}@${digest}"

      # The daily dependency job only reports pending package upgrades. An image
      # that is published (and then deployed) with an upgrade already available
      # means the dependency layer is behind, so fail instead of shipping it;
      # re-running the workflow rebuilds with the patched package.
      - name: 🔍 Assert no pending package upgrades
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          out="$(scripts/deps.sh apk "${REGISTRY}/${IMAGE_NAME}@${DIGEST}")"
          printf '%s\n' "$out"
          count="$(printf '%s\n' "$out" | sed -n 's/^upgradable packages: //p' | tail -n 1)"
          if [ "${count:-1}" -ne 0 ]; then
            echo "::error::${count:-unknown} package upgrade(s) are already available; re-run this workflow to rebuild with them"
            exit 1
          fi

      # The digest above is what the deploy job rolls out, so boot it and
      # run the in-container checks now: a failure here fails the build job, and
      # the deploy job only runs after this job succeeds.
      - name: 🚑 Runtime smoke test the published image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: python3 tests/runtime-smoke.py "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # GitHub stops scheduled workflows without saying so: this repository's
      # nightly cleanup last ran on 2026-01-03, so the 30-day tag expiry the
      # README promises had not been enforced for months. Expire the old
      # timestamp tags here too whenever the schedule looks stale. Untagged and
      # partial images stay with the nightly job.
      - name: 🕵️ Check the nightly cleanup schedule
        id: cleanup-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          needed=false
          if ! last="$(timeout 30 gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ghcr-cleanup.yml/runs?event=schedule&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')"; then
            echo "::warning::could not read the cleanup schedule; running the sweep"
            needed=true
          elif [ -z "$last" ]; then
            echo "no scheduled cleanup run found"
            needed=true
          else
            age_days=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
            echo "last scheduled cleanup: ${last} (${age_days} days ago)"
            if [ "$age_days" -ge 7 ]; then
              needed=true
            fi
          fi
          echo "needed=${needed}" >> "$GITHUB_OUTPUT"

          # Same failure mode, different victim: report the dependency check if
          # it stops firing, without blocking the deploy. Count the workflow_run
          # fallback as an automatic check too; otherwise a healthy fallback
          # still prints "no scheduled dependency check has ever run".
          if ! deps_last="$(timeout 30 gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/dependency-updates.yml/runs?per_page=50" \
            --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_run")] | first | .created_at // empty')"; then
            echo "::warning::could not read the dependency check history"
          elif [ -z "$deps_last" ]; then
            echo "::warning::no automatic dependency check has ever run"
          else
            deps_age=$(( ( $(date -u +%s) - $(date -u -d "$deps_last" +%s) ) / 86400 ))
            echo "last automatic dependency check: ${deps_last} (${deps_age} days ago)"
            if [ "$deps_age" -ge 3 ]; then
              echo "::warning::the automatic dependency check has not run for ${deps_age} days"
            fi
          fi

      # Best effort on purpose: a registry housekeeping failure must not hold
      # back a security deployment, but it stays visible in this run.
      - name: 🧹 Expire timestamp tags (nightly cleanup is behind)
        id: expiry
        if: steps.cleanup-check.outputs.needed == 'true'
        continue-on-error: true
        uses: ./.github/actions/expire-tags
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ github.event.repository.name }}

      # `continue-on-error` keeps the deploy alive, so the failed step is the
      # only trace and the run still reports success. Say it out loud instead.
      - name: ⚠️ Report the failed tag expiry
        if: steps.expiry.outcome == 'failure'
        run: echo "::warning::the old timestamp tags were not expired; the nightly cleanup will retry"

  deploy:
    needs: build
    # workflow_run never fired for a workflow_dispatch build, so a manual
    # rebuild used to publish an image that never reached Fly. The deploy lives
    # here so every published digest, from a push or a manual rebuild, can be
    # rolled out.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      # An `exit 0` only ends this step, so a superseded build used to keep
      # going and overwrite the newer release. The guard publishes an output and
      # the deploy steps below are skipped explicitly.
      #
      # The guard stands down only when a newer run of this workflow exists for
      # main. Comparing the tip of main instead cancelled the deploy whenever a
      # doc-only commit landed mid-build: paths-ignore means that commit never
      # starts a run, so nothing was left to publish the code being built.
      - name: 🚦 Check whether a newer build has taken over
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          skip=false
          if ! newest="$(timeout 30 gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build-and-deploy.yml/runs?branch=main&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')"; then
            newest=""
          fi
          if [ -z "$newest" ]; then
            echo "::warning::could not read the workflow runs; deploying this build"
          elif [ "$newest" != "${GITHUB_SHA}" ]; then
            skip=true
            echo "A newer build for ${newest} has taken over; skipping deploy of ${GITHUB_SHA}." >&2
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: 🚀 Set up Flyctl
        if: steps.guard.outputs.skip != 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: 🛫 Release
        if: steps.guard.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # Passed through a secret so flyctl's own output (which prints the app
          # name) is masked in this public repository's logs.
          FLY_APP: ${{ secrets.FLY_APP }}
        run: |
          set -euo pipefail
          : "${FLY_APP:?repository secret FLY_APP must hold the Fly app name}"
          flyctl deploy --app "$FLY_APP" \
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}" \
            --yes
