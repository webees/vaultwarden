name: ✅ Pull Request Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🐚 Check shell scripts
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh
          bash -n scripts/*.sh

      - name: 🌐 Refresh Cloudflare IP ranges
        run: |
          {
            curl -fsSL https://www.cloudflare.com/ips-v4
            printf '\n'
            curl -fsSL https://www.cloudflare.com/ips-v6
            printf '\n'
          } | awk 'NF {print "client_ip "$0}' > config/cloudflare-ips.caddy
          test "$(wc -l < config/cloudflare-ips.caddy)" -gt 20

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Log into the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: pr-validation:latest
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🧪 Validate the Caddy configuration
        run: |
          docker run --rm --entrypoint caddy pr-validation:latest \
            validate --config /Caddyfile --adapter caddyfile
