name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Validation never pushes.
          persist-credentials: false

      - name: Shell and Python scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          mapfile -d '' shell_files < <(find scripts tests -type f -name '*.sh' -print0)
          shellcheck "${shell_files[@]}"
          python3 -m py_compile scripts/*.py tests/*.py
          python3 -m unittest discover -s tests -p 'test_*.py'

      # Parse every workflow, composite action and fly.toml.
      - name: Workflow, action and fly.toml syntax
        run: |
          set -euo pipefail
          files="$(find .github -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)"
          # An empty search result is a failure.
          test -n "$files"
          while IFS= read -r file; do
            ruby -ryaml -e 'YAML.load_file(ARGV[0]); puts "ok #{ARGV[0]}"' "$file"
          done <<< "$files"
          python3 -c 'import tomllib; tomllib.load(open("fly.toml", "rb")); print("ok fly.toml")'

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            --output "$tmp/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$tmp/$archive" | sha256sum -c -
          tar -xzf "$tmp/$archive" -C "$tmp" actionlint
          "$tmp/actionlint" -no-color

      - name: Helper self tests
        run: tests/selftest.sh

      # main builds the image once; pre-merge events validate it here.
      - name: Build and validate the image
        if: github.event_name != 'push'
        run: |
          docker build --tag validate:local .
          python3 tests/runtime_smoke.py validate:local

      # Exercise both SMTP configuration branches.
      - name: SMTP config branches
        if: github.event_name != 'push'
        run: |
          docker run --rm validate:local /entrypoint.sh sh -c '
            test ! -s /etc/msmtprc
            echo "no SMTP settings: /etc/msmtprc left empty"'
          docker run --rm \
            --env SMTP_HOST=smtp.example.com \
            --env SMTP_TO=ops@example.com \
            --env SMTP_FROM=from@example.com \
            --env SMTP_USERNAME=user \
            --env SMTP_PASSWORD=secret \
            validate:local /entrypoint.sh sh -c '
              set -e
              grep -qx "host smtp.example.com" /etc/msmtprc
              grep -qx "from from@example.com" /etc/msmtprc
              grep -qx "password secret" /etc/msmtprc
              test "$(stat -c %a /etc/msmtprc)" = 600
              test "$(stat -c %U /etc/msmtprc)" = vaultwarden
              echo "SMTP settings: config written, 0600, owned by vaultwarden"'
