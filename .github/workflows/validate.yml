name: ✅ Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Validation never pushes, so the workflow token does not belong in
          # .git/config where a later step could reuse it.
          persist-credentials: false

      - name: 🐚 Shell and Python scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh tests/*.sh
          python3 -m py_compile tests/*.py

      # Every YAML file under .github, not a list of names: the composite action
      # that expires GHCR tags was never parsed, so a syntax error there would
      # only surface when a run reached that step.
      - name: 🧾 Workflow, action and fly.toml syntax
        run: |
          set -euo pipefail
          files="$(find .github -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)"
          # An empty list means the search broke, not that there is nothing to check.
          test -n "$files"
          while IFS= read -r file; do
            ruby -ryaml -e 'YAML.load_file(ARGV[0]); puts "ok #{ARGV[0]}"' "$file"
          done <<< "$files"
          python3 -c 'import tomllib; tomllib.load(open("fly.toml", "rb")); print("ok fly.toml")'

      - name: 🌐 Refresh the Cloudflare ranges
        run: scripts/refresh-cloudflare-ips.sh

      - name: 🧪 Helper self tests
        run: tests/selftest.sh

      # A push to main already builds the multi-arch image in the Docker workflow
      # and deploys that exact digest. Rebuilding here would double the build
      # work for every merge, so the image steps stay on the pre-merge events.
      - name: 🐳 Build and validate the image
        if: github.event_name != 'push'
        run: |
          docker build --tag validate:local .
          python3 tests/runtime-smoke.py validate:local

      # entrypoint.sh has two branches: write /etc/msmtprc from SMTP_*, or leave
      # it empty so alerts are skipped. Both are exercised here.
      - name: 📧 SMTP config branches
        if: github.event_name != 'push'
        run: |
          docker run --rm validate:local /entrypoint.sh sh -c '
            test ! -s /etc/msmtprc
            echo "no SMTP settings: /etc/msmtprc left empty"'
          docker run --rm \
            --env SMTP_HOST=smtp.example.com \
            --env SMTP_TO=ops@example.com \
            --env SMTP_FROM=from@example.com \
            --env SMTP_USERNAME=user \
            --env SMTP_PASSWORD=secret \
            validate:local /entrypoint.sh sh -c '
              set -e
              grep -qx "host smtp.example.com" /etc/msmtprc
              grep -qx "from from@example.com" /etc/msmtprc
              grep -qx "password secret" /etc/msmtprc
              test "$(stat -c %a /etc/msmtprc)" = 600
              test "$(stat -c %U /etc/msmtprc)" = vaultwarden
              echo "SMTP settings: config written, 0600, owned by vaultwarden"'
