name: ✅ Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🐚 Shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh tests/*.sh

      - name: 🧾 Workflow YAML
        run: |
          for file in .github/workflows/*.yml; do
            ruby -ryaml -e 'YAML.load_file(ARGV[0])' "$file"
            echo "ok ${file}"
          done

      - name: 🌐 Refresh the Cloudflare ranges
        run: scripts/refresh-cloudflare-ips.sh

      - name: 🧪 Helper self tests
        run: tests/selftest.sh

      - name: 🐳 Build and validate the image
        run: |
          docker build --tag validate:local .
          docker run --rm --entrypoint caddy validate:local \
            validate --config /Caddyfile --adapter caddyfile

      # Caddy runs unprivileged and reads files baked into the image, so a
      # root-only file or a broken process graph only shows up at runtime.
      - name: 🚑 Runtime smoke test
        run: |
          docker run --detach --name smoke \
            --env CADDY_DOMAINS=example.com \
            --env DOMAIN=https://example.com \
            --env I_REALLY_WANT_VOLATILE_STORAGE=true \
            validate:local /entrypoint.sh overmind start
          alive=1
          for _ in $(seq 1 30); do
            if docker exec smoke wget -qO- http://127.0.0.1:8080/alive >/dev/null 2>&1; then
              alive=0
              break
            fi
            sleep 2
          done
          if [ "$alive" -ne 0 ]; then
            echo "/alive never came up" >&2
            docker logs smoke >&2
            docker rm --force smoke >/dev/null
            exit 1
          fi
          echo "/alive responded through Caddy"
          docker cp tests/image-selftest.sh smoke:/tmp/image-selftest.sh
          docker exec smoke sh /tmp/image-selftest.sh
          docker rm --force smoke >/dev/null

      # entrypoint.sh has two branches: write /etc/msmtprc from SMTP_*, or leave
      # it empty so alerts are skipped. Both are exercised here.
      - name: 📧 SMTP config branches
        run: |
          docker run --rm validate:local /entrypoint.sh sh -c '
            test ! -s /etc/msmtprc
            echo "no SMTP settings: /etc/msmtprc left empty"'
          docker run --rm \
            --env SMTP_HOST=smtp.example.com \
            --env SMTP_TO=ops@example.com \
            --env SMTP_FROM=from@example.com \
            --env SMTP_USERNAME=user \
            --env SMTP_PASSWORD=secret \
            validate:local /entrypoint.sh sh -c '
              set -e
              grep -qx "host smtp.example.com" /etc/msmtprc
              grep -qx "from from@example.com" /etc/msmtprc
              grep -qx "password secret" /etc/msmtprc
              test "$(stat -c %a /etc/msmtprc)" = 600
              test "$(stat -c %U /etc/msmtprc)" = vaultwarden
              echo "SMTP settings: config written, 0600, owned by vaultwarden"'
