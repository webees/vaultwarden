name: 🐳 Docker (Multi-Arch)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    tags: [ '*' ]
    # fly.toml is a production input: it carries the machine config that only
    # `flyctl deploy` applies. Ignoring it here meant a config-only commit built
    # nothing and deployed nothing, so the change silently never reached Fly.
    paths-ignore:
      - README.md
      - LICENSE
  schedule:
    # Weekly rebuild keeps Alpine package (caddy/restic/sqlite) security fixes flowing
    - cron: '0 4 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ghcr-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.digest.outputs.tag }}
      digest: ${{ steps.digest.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🌐 Refresh Cloudflare IP ranges
        run: scripts/refresh-cloudflare-ips.sh

      - name: 🧹 Invalidate package layer cache
        id: cache-bust
        run: |
          # apk only pulls patched packages when this layer is rebuilt, so give
          # every scheduled run a unique cache key for the dependency layer.
          echo "cache-bust=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: ⚙️ Enable QEMU for cross-platform builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container
          use: true

      - name: 🔐 Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🕒 Compute image timestamp
        id: timestamp
        run: |
          value="$(TZ=Asia/Shanghai date +%Y%m%d%H%M)"
          echo "value=${value}" >> "$GITHUB_OUTPUT"
          echo "Image timestamp: ${value}"

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.timestamp.outputs.value }},enable=true
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=tag

      - name: ✅ Verify timestamp tag
        env:
          TIMESTAMP_TAG: ${{ steps.timestamp.outputs.value }}
          METADATA_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          expected="${REGISTRY}/${IMAGE_NAME}:${TIMESTAMP_TAG}"
          if ! grep -Fxq "$expected" <<< "$METADATA_TAGS"; then
            echo "Missing timestamp tag: ${expected}" >&2
            echo "$METADATA_TAGS" >&2
            exit 1
          fi
          echo "Timestamp tag verified: ${expected}"

      - name: 🚀 Build and push Docker image (Multi-Arch)
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          build-args: |
            CACHE_BUST=${{ steps.cache-bust.outputs.cache-bust }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🧾 Record the published amd64 digest
        id: digest
        env:
          TIMESTAMP_TAG: ${{ steps.timestamp.outputs.value }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${TIMESTAMP_TAG}" \
            --format '{{range .Manifest.Manifests}}{{if eq .Platform.Architecture "amd64"}}{{.Digest}}{{end}}{{end}}')"
          test -n "$digest"
          echo "tag=${TIMESTAMP_TAG}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "tag=${TIMESTAMP_TAG}"
            echo "digest=${digest}"
          } > build-output.txt
          echo "Published ${REGISTRY}/${IMAGE_NAME}:${TIMESTAMP_TAG}@${digest}"

      - name: 📤 Upload the build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-output
          path: build-output.txt
          retention-days: 7
