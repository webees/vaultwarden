name: 🐳 Docker (Multi-Arch)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    tags: [ '*' ]
    paths-ignore:
      - fly.toml
      - README.md
      - LICENSE
  schedule:
    # Weekly rebuild keeps Alpine package (caddy/restic/sqlite) security fixes flowing
    - cron: '0 4 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ghcr-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.digest.outputs.tag }}
      digest: ${{ steps.digest.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🌐 Refresh Cloudflare IP ranges
        run: |
          {
            curl -fsSL https://www.cloudflare.com/ips-v4
            printf '\n'
            curl -fsSL https://www.cloudflare.com/ips-v6
            printf '\n'
          } | awk 'NF {print "client_ip "$0}' > config/cloudflare-ips.caddy
          test "$(wc -l < config/cloudflare-ips.caddy)" -gt 20

      - name: 🧹 Invalidate package layer cache
        id: cache-bust
        run: |
          # apk only pulls patched packages when this layer is rebuilt, so give
          # every scheduled run a unique cache key for the dependency layer.
          echo "cache-bust=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: ⚙️ Enable QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          use: true

      - name: 🔐 Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🕒 Compute image timestamp
        id: timestamp
        run: |
          value="$(TZ=Asia/Shanghai date +%Y%m%d%H%M)"
          echo "value=${value}" >> "$GITHUB_OUTPUT"
          echo "Image timestamp: ${value}"

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.timestamp.outputs.value }},enable=true
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr

      - name: ✅ Verify timestamp tag
        env:
          TIMESTAMP_TAG: ${{ steps.timestamp.outputs.value }}
          METADATA_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          expected="${REGISTRY}/${IMAGE_NAME}:${TIMESTAMP_TAG}"
          if ! grep -Fxq "$expected" <<< "$METADATA_TAGS"; then
            echo "Missing timestamp tag: ${expected}" >&2
            echo "$METADATA_TAGS" >&2
            exit 1
          fi
          echo "Timestamp tag verified: ${expected}"

      - name: 🚀 Build and push Docker image (Multi-Arch)
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            CACHE_BUST=${{ steps.cache-bust.outputs.cache-bust }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🧾 Record the published amd64 digest
        if: github.event_name != 'pull_request'
        id: digest
        env:
          TIMESTAMP_TAG: ${{ steps.timestamp.outputs.value }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${TIMESTAMP_TAG}" \
            --format '{{range .Manifest.Manifests}}{{if eq .Platform.Architecture "amd64"}}{{.Digest}}{{end}}{{end}}')"
          test -n "$digest"
          echo "tag=${TIMESTAMP_TAG}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "tag=${TIMESTAMP_TAG}"
            echo "digest=${digest}"
          } > build-output.txt
          echo "Published ${REGISTRY}/${IMAGE_NAME}:${TIMESTAMP_TAG}@${digest}"

      - name: 📤 Upload the build output
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: build-output.txt
          retention-days: 7
