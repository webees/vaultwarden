name: 🧹 GHCR Cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  packages: write

concurrency:
  # Serialize with the image build workflow so cleanup never races a push.
  group: ghcr-registry
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔍 Cleanup GHCR
        uses: ./.github/actions/expire-tags
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ github.event.repository.name }}
          delete-untagged: true
          delete-broken: true
