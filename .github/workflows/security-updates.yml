name: 🛡️ Daily Security Updates

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🔎 Resolve upstream digest
        id: upstream
        run: |
          set -euo pipefail
          json="$(curl -fsSL 'https://hub.docker.com/v2/repositories/vaultwarden/server/tags?page_size=100&ordering=last_updated')"
          tag="$(jq -r '[.results[].name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+-alpine$"))] | first' <<< "$json")"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Could not resolve the latest upstream tag" >&2
            exit 1
          fi
          token="$(curl -fsSL 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:vaultwarden/server:pull' \
            | jq -r .token)"
          digest="$(curl -fsSI -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://registry-1.docker.io/v2/vaultwarden/server/manifests/${tag}" \
            | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" {print $2; exit}')"
          if [ -z "$digest" ]; then
            echo "Could not resolve the digest for ${tag}" >&2
            exit 1
          fi
          echo "version=${tag%-alpine}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: 📌 Compare with Dockerfile pins
        id: compare
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          UPSTREAM_DIGEST: ${{ steps.upstream.outputs.digest }}
        run: |
          set -euo pipefail
          current_version="$(sed -n 's/^ARG VAULTWARDEN_VERSION=//p' Dockerfile | head -n 1)"
          current_digest="$(sed -n 's/^ARG VAULTWARDEN_DIGEST=//p' Dockerfile | head -n 1)"
          echo "current: ${current_version} ${current_digest}"
          echo "upstream: ${UPSTREAM_VERSION} ${UPSTREAM_DIGEST}"
          if [ "$current_version" = "$UPSTREAM_VERSION" ] && [ "$current_digest" = "$UPSTREAM_DIGEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔧 Update pinned version and digest
        if: steps.compare.outputs.changed == 'true'
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          UPSTREAM_DIGEST: ${{ steps.upstream.outputs.digest }}
        run: |
          set -euo pipefail
          sed -i "s|^ARG VAULTWARDEN_VERSION=.*|ARG VAULTWARDEN_VERSION=${UPSTREAM_VERSION}|" Dockerfile
          sed -i "s|^ARG VAULTWARDEN_DIGEST=.*|ARG VAULTWARDEN_DIGEST=${UPSTREAM_DIGEST}|" Dockerfile
          git diff -- Dockerfile

      - name: 📬 Open a pull request
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          UPSTREAM_DIGEST: ${{ steps.upstream.outputs.digest }}
        run: |
          set -euo pipefail
          branch="security/upstream-${UPSTREAM_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add Dockerfile
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "chore(deps): update Vaultwarden to ${UPSTREAM_VERSION}"
          git push --force origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "chore(deps): update Vaultwarden to ${UPSTREAM_VERSION}" \
            --body "Upstream \`vaultwarden/server:${UPSTREAM_VERSION}-alpine\` is now pinned at \`${UPSTREAM_DIGEST}\`. Merging this PR makes the next image build pick up the newer Alpine packages." \
            || echo "PR already exists"
