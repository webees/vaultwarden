name: Dependency Updates

on:
  # GitHub's schedule is best-effort: it can be delayed for tens of minutes and
  # is disabled for an inactive repository. A completed build is a real event
  # that proves the repository is active, so use it as a fallback trigger. The
  # check is a no-op when the pins already match, and the concurrency group
  # keeps it from overlapping the schedule.
  workflow_run:
    workflows: ["🐳 Build and Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      auto_merge:
        description: "Merge the generated dependency PR automatically"
        type: boolean
        default: true
      operation:
        description: "Run one fixed production operation"
        type: choice
        default: none
        options:
          - none
          - audit
          - check-freshness
          - snapshots
          - verify
          - restore-test
          - backup
  schedule:
    # Every two hours: a Vaultwarden release should not wait a full day to be
    # noticed. Minute 41 keeps the run out of the top-of-the-hour queue spike,
    # and a run whose pins already match is a no-op that opens no PR.
    - cron: '41 */2 * * *'

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  FLY_LOG_REDACT: |
    s/fdaa:[0-9a-fA-F:]+/[redacted-fly-private-ipv6]/g
    s/([Uu]pdating[[:space:]]+)[0-9a-fA-F]{12,}([[:space:]]+\[[^]]+\])/\1[redacted-fly-machine-id]\2/g
    s/(([Mm]achine[[:space:]]+[Ii][Dd][[:space:]]*:[[:space:]]*|[Mm]achine[[:space:]]+[Cc]onfig[[:space:]]+for[[:space:]]+|[Ll]ease[[:space:]]+for[[:space:]]+|[Mm]achine[[:space:]]+)(img_)?)[[:alnum:]_-]{12,}/\1[redacted-fly-machine-id]/g
    /[Mm]achine/ s/("(id|[Mm]achine[Ii][Dd])"[[:space:]]*:[[:space:]]*")[^"]+/\1[redacted-fly-machine-id]/g
    s/(([Ii]mage[[:space:]]+[Ii][Dd][[:space:]]*:[[:space:]]*|[Ii]mage[[:space:]]+)(img_)?)[[:alnum:]_-]{12,}/\1[redacted-fly-image-id]/g
    s/(img|app|vol|org|mach)_[[:alnum:]_-]+/[redacted-fly-id]/g
    /^[[:space:]]*[0-9a-fA-F]{8}[[:space:]]/ s/([[:space:]])[0-9a-fA-F]{12,}([[:space:]]|$)/\1[redacted-fly-machine-host]\2/g

concurrency:
  group: dependency_updates
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.operation == 'none'
    runs-on: ubuntu-24.04
    # The post-merge step alone waits up to ten minutes for the pull request to
    # land, so bound the whole job rather than the six-hour default.
    timeout-minutes: 40
    # One decision for "this run merges the dependency PR": the schedule always
    # merges, a manual dispatch only when asked to. The merge and the dispatch
    # that follows it both read this value, so the two cannot disagree.
    env:
      AUTO_MERGE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.auto_merge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔎 Resolve the Vaultwarden base image
        id: base
        run: scripts/deps.sh base

      - name: 🧰 Resolve supercronic
        id: tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/deps.sh tools

      - name: 📌 Compare the Dockerfile pins
        id: compare
        run: |
          scripts/deps.sh compare \
            VAULTWARDEN_VERSION="${{ steps.base.outputs.version }}" \
            VAULTWARDEN_DIGEST="${{ steps.base.outputs.digest }}" \
            SUPERCRONIC_VERSION="${{ steps.tools.outputs.supercronic_version }}" \
            SUPERCRONIC_SHA256_amd64="${{ steps.tools.outputs.supercronic_sha_amd64 }}" \
            SUPERCRONIC_SHA256_arm64="${{ steps.tools.outputs.supercronic_sha_arm64 }}"

      - name: 📦 Compare the Alpine packages
        id: apk
        run: scripts/deps.sh apk "vaultwarden/server@${{ steps.base.outputs.digest }}"

      - name: 🔧 Update the pins and validate the build
        if: steps.compare.outputs.changed == 'true'
        run: |
          scripts/deps.sh apply \
            VAULTWARDEN_VERSION="${{ steps.base.outputs.version }}" \
            VAULTWARDEN_DIGEST="${{ steps.base.outputs.digest }}" \
            SUPERCRONIC_VERSION="${{ steps.tools.outputs.supercronic_version }}" \
            SUPERCRONIC_SHA256_amd64="${{ steps.tools.outputs.supercronic_sha_amd64 }}" \
            SUPERCRONIC_SHA256_arm64="${{ steps.tools.outputs.supercronic_sha_arm64 }}"
          docker build --tag dependency-check:local .
          docker run --rm --entrypoint caddy dependency-check:local \
            validate --config /Caddyfile --adapter caddyfile

      - name: 📬 Open the dependency PR
        id: pr
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.base.outputs.version }}
          DIGEST: ${{ steps.base.outputs.digest }}
          SUPERCRONIC: ${{ steps.tools.outputs.supercronic_version }}
          APK_COUNT: ${{ steps.apk.outputs.count }}
          APK_ROWS: ${{ steps.apk.outputs.rows }}
        run: |
          set -euo pipefail
          # Keep one automation branch: a version-named branch leaves the old
          # PR open with auto-merge armed when the version moves, so the stale
          # pins can merge after the newer update.
          branch="deps/upstream"
          title="chore(deps): update pinned upstream dependencies (${VERSION})"
          body_file="${RUNNER_TEMP:-/tmp}/pr-body.md"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          {
            echo "Automated dependency check."
            echo
            echo "| Dependency | Pinned |"
            echo "| :--- | :--- |"
            echo "| vaultwarden/server | ${VERSION}-alpine @ ${DIGEST} |"
            echo "| supercronic | ${SUPERCRONIC} |"
            echo
            echo "Alpine package updates available inside the base image (\`${APK_COUNT:-0}\`):"
            echo
            if [ "${APK_COUNT:-0}" -gt 0 ]; then
              echo "| Installed | Available |"
              echo "| :--- | :--- |"
              printf '%s\n' "$APK_ROWS" | awk 'NF {print "| `" $1 "` | `" $2 "` |"}'
            else
              echo "_No package upgrades are pending in the pinned base image._"
            fi
            echo
            echo "Merging rebuilds a timestamped image and rolls the new digest out to Fly automatically."
          } > "$body_file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add Dockerfile
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "chore(deps): update pinned upstream dependencies"
          git push --force origin "$branch"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Swallowing this failure reported every auth or API error as an
          # existing PR, and the auto-merge step then failed with a misleading
          # cause. Ask for open PRs explicitly, and refresh their metadata
          # instead of leaving a body that describes an older pin set.
          open_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" \
            --state open --json number --jq 'length')"
          if [ "$open_pr" -gt 0 ]; then
            gh pr edit "$branch" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file "$body_file"
            echo "updated the existing open PR for ${branch}"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "$title" \
              --body-file "$body_file"
          fi
          echo "number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" \
            --state open --json number --jq '.[0].number // empty')" >> "$GITHUB_OUTPUT"

      # main now requires the `validate` check, so the merge is armed instead of
      # performed: GitHub merges only once that check passes. Without --auto the
      # merge is refused outright, which is what used to hide the missing gate.
      #
      # A pull request opened with GITHUB_TOKEN has its `pull_request` runs held
      # with the conclusion `action_required`, so `validate` never starts and the
      # required check never reports: the armed merge then waits forever. A
      # workflow_dispatch run does not help, because its check suite is not
      # attached to the pull request. Release the held run instead.
      - name: ✅ Release the held validate run
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 18); do
            id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&head_sha=${SHA}&per_page=20" \
              --jq '[.workflow_runs[] | select(.conclusion == "action_required")] | first | .id // empty')" || id=""
            if [ -n "$id" ]; then
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" >/dev/null
              echo "released the held pull_request run ${id}"
              exit 0
            fi
            sleep 10
          done
          echo "no held pull_request run appeared for ${SHA}" >&2
          exit 1

      - name: 🔀 Arm auto-merge on the dependency PR
        id: arm
        if: steps.compare.outputs.changed == 'true' && env.AUTO_MERGE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail
          gh pr merge "$BRANCH" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --auto
          # Fail loudly if the required check never registers, instead of leaving
          # the PR parked with nothing to explain why.
          for _ in $(seq 1 18); do
            # `2>/dev/null || echo 0` read an API failure as "no checks
            # registered", so the final message blamed the wrong thing.
            registered=""
            if ! registered="$(gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" \
                --json statusCheckRollup --jq '.statusCheckRollup | length')"; then
              registered=""
            fi
            case "$registered" in
                ''|*[!0-9]*)
                    echo "::warning::could not read the status checks for ${BRANCH}; retrying"
                    ;;
                0) ;;
                *)
                    echo "auto-merge armed; ${registered} status check(s) registered on ${BRANCH}"
                    exit 0
                    ;;
            esac
            sleep 10
          done
          echo "no status check registered on ${BRANCH} within 180s; the merge is still gated" >&2
          exit 1

      # Auto-merge merges with GITHUB_TOKEN, and a GITHUB_TOKEN push does not
      # trigger workflows either, so the build workflow never sees the merge
      # commit: the new digest would never be built and Fly would keep running
      # the old image. Dispatch the build ourselves once the merge lands.
      #
      # Only when this run is the one merging: with the merge left to a human
      # (a manual dispatch with auto_merge off) that merge arrives as an ordinary
      # push, and polling for ten minutes only failed a run that did its job.
      - name: 🚀 Build and deploy after the merge
        if: >-
          always() &&
          steps.compare.outputs.changed == 'true' &&
          steps.pr.outcome == 'success' &&
          steps.arm.outcome == 'success' &&
          env.AUTO_MERGE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          [ -n "$NUMBER" ] || { echo "no dependency pull request number recorded" >&2; exit 1; }
          for _ in $(seq 1 40); do
            state="$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
            if [ "$state" = "MERGED" ]; then
              gh workflow run build_and_deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
              echo "dispatched the build for the merged dependency update"
              exit 0
            fi
            sleep 15
          done
          echo "pull request ${NUMBER} did not merge within 10 minutes" >&2
          exit 1

      # A package-only update never changes the Dockerfile, so no PR exists to
      # merge. Rebuild the published image directly instead of waiting for the
      # weekly schedule; the build workflow upgrades the packages and deploys.
      #
      # Skip this for a workflow_run fallback: the apk probe reads the pinned
      # base image, which still lists the same upgrades after our build has
      # already applied them, so allowing it there would loop build -> check ->
      # build. The schedule and the weekly rebuild still cover package updates.
      - name: ♻️ Rebuild when only Alpine packages moved
        if: success() && steps.compare.outputs.changed != 'true' && github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_COUNT: ${{ steps.apk.outputs.count }}
        run: |
          set -euo pipefail
          if scripts/deps.sh rebuild-needed "${APK_COUNT:-0}"; then
            gh workflow run build_and_deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi

  production_operation:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: 🚀 Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: 🔍 Run one fixed production operation
        id: operation
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}
          OPERATION: ${{ github.event.inputs.operation }}
        run: |
          set -euo pipefail
          : "${FLY_APP:?repository secret FLY_APP must hold the Fly app name}"
          case "$OPERATION" in
            audit)           command="/restic.sh audit" ;;
            check-freshness) command="/restic.sh check-freshness" ;;
            snapshots)       command="/restic.sh snapshots" ;;
            verify)          command="/restic.sh verify" ;;
            restore-test)    command="/restic.sh restore-test" ;;
            backup)          command="/restic.sh backup" ;;
            *)
              echo "::error::unsupported production operation" >&2
              exit 2
              ;;
          esac
          timeout 2400 flyctl ssh console --app "$FLY_APP" --command "$command" \
            2>&1 | sed -E "$FLY_LOG_REDACT"

  watchdog:
    # The app's scheduler cannot report its own silence. This job runs on the
    # same external triggers as the dependency check and asks the live app
    # whether its last successful backup is still fresh. A failure fails this
    # workflow, which is the second channel: GitHub emails the repository owner
    # even when Telegram is the thing that broke.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 🚀 Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: 💓 Check the production backup heartbeat
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}
        run: |
          set -euo pipefail
          : "${FLY_APP:?repository secret FLY_APP must hold the Fly app name}"
          flyctl ssh console --app "$FLY_APP" --command "/restic.sh check-freshness" \
            2>&1 | sed -E "$FLY_LOG_REDACT"

  notify_failure:
    # GitHub email is the last-resort channel if this job cannot reach Telegram.
    # The notification job must wait for every possible work job, otherwise a
    # failure could be reported before the job that actually failed has ended.
    if: failure()
    needs:
      - check
      - production_operation
      - watchdog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ secrets.FLY_APP }}
    steps:
      - name: 🚀 Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: 📣 Send the failure through Telegram
        env:
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_JOBS: check=${{ needs.check.result }},production_operation=${{ needs.production_operation.result }},watchdog=${{ needs.watchdog.result }}
        run: |
          set -euo pipefail
          : "${FLY_API_TOKEN:?repository secret FLY_API_TOKEN must hold a Fly token}"
          : "${FLY_APP:?repository secret FLY_APP must hold the Fly app name}"

          # The Telegram credentials already live in the application secret
          # store. Keep them out of GitHub secrets and out of the step output.
          credentials=""
          # shellcheck disable=SC2016  # These variables expand inside the app.
          if ! credentials="$(timeout 30 flyctl ssh console --quiet --app "$FLY_APP" \
              --command 'printf "TELEGRAM_BOT_TOKEN=%s\nTELEGRAM_CHAT_ID=%s\n" "$TELEGRAM_BOT_TOKEN" "$TELEGRAM_CHAT_ID"' \
              2>/dev/null)"; then
            echo "::error::Could not read Telegram credentials from the app environment" >&2
            exit 1
          fi

          token=""
          chat_id=""
          token_seen=0
          chat_id_seen=0
          while IFS= read -r line; do
            case "$line" in
              TELEGRAM_BOT_TOKEN=*)
                [ "$token_seen" -eq 0 ] || {
                  echo "::error::The app returned ambiguous Telegram credentials" >&2
                  exit 1
                }
                token="${line#TELEGRAM_BOT_TOKEN=}"
                token_seen=1
                ;;
              TELEGRAM_CHAT_ID=*)
                [ "$chat_id_seen" -eq 0 ] || {
                  echo "::error::The app returned ambiguous Telegram credentials" >&2
                  exit 1
                }
                chat_id="${line#TELEGRAM_CHAT_ID=}"
                chat_id_seen=1
                ;;
              '')
                ;;
              *)
                echo "::error::The app returned unexpected credential output" >&2
                exit 1
                ;;
            esac
          done <<< "$credentials"

          [ "$token_seen" -eq 1 ] || {
            echo "::error::The app did not provide TELEGRAM_BOT_TOKEN" >&2
            exit 1
          }
          [ "$chat_id_seen" -eq 1 ] || {
            echo "::error::The app did not provide TELEGRAM_CHAT_ID" >&2
            exit 1
          }

          case "$token" in
            ''|*[!0-9A-Za-z:_-]*)
              echo "::error::The app did not provide a usable Telegram bot token" >&2
              exit 1
              ;;
            *:*) ;;
            *)
              echo "::error::The app did not provide a usable Telegram bot token" >&2
              exit 1
              ;;
          esac
          case "$chat_id" in
            @*)
              case "${chat_id#@}" in
                ''|*[!A-Za-z0-9_]*)
                  echo "::error::The app did not provide a usable Telegram chat id" >&2
                  exit 1
                  ;;
              esac
              ;;
            -[0-9]*|[0-9]*)
              case "${chat_id#-}" in
                ''|*[!0-9]*)
                  echo "::error::The app did not provide a usable Telegram chat id" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::The app did not provide a usable Telegram chat id" >&2
              exit 1
              ;;
          esac
          echo "::add-mask::${token}"
          echo "::add-mask::${chat_id}"

          message="$(printf 'Workflow failed: %s\nSHA: %s\nJobs: %s\nRun: %s' \
            "$WORKFLOW" "$SHA" "$FAILED_JOBS" "$RUN_URL")"
          response_file="$(mktemp "${RUNNER_TEMP:-/tmp}/telegram-response.XXXXXX")"
          error_file="$(mktemp "${RUNNER_TEMP:-/tmp}/telegram-error.XXXXXX")"
          cleanup() {
            rm -f "$response_file" "$error_file"
          }
          trap cleanup EXIT

          set +e
          status="$(curl --silent --show-error --max-time 15 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --data-urlencode "chat_id=${chat_id}" \
            --data-urlencode "text=${message}" \
            "https://api.telegram.org/bot${token}/sendMessage" 2>"$error_file")"
          rc=$?
          set -e

          redact_file() {
            local body
            body="$(head -c 4096 "$1")"
            body="${body//"$token"/<redacted>}"
            body="${body//"$chat_id"/<redacted>}"
            printf '%s' "$body"
          }

          if [ "$rc" -ne 0 ]; then
            detail="$(redact_file "$error_file")"
            echo "::error::Telegram failure alert transport failed (curl exit ${rc}): ${detail:-no diagnostic}" >&2
            exit 1
          fi
          if [ "$status" != "200" ]; then
            detail="$(redact_file "$response_file")"
            echo "::error::Telegram failure alert rejected (HTTP ${status}): ${detail:-no response body}" >&2
            exit 1
          fi
          echo "Telegram failure alert sent"
