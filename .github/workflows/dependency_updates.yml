name: Dependency Updates

on:
  # A completed build is an activity-backed fallback for unreliable scheduling.
  workflow_run:
    workflows: ["Build and Deploy"]
    types: [completed]
    branches: [main]
  # Read Dependabot metadata without executing its PR tree.
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]
  workflow_dispatch:
    inputs:
      auto_merge:
        description: "Merge the generated dependency PR automatically"
        type: boolean
        default: true
      operation:
        description: "Run one fixed production operation"
        type: choice
        default: none
        options:
          - none
          - audit
          - check-freshness
          - notify-test
          - snapshots
          - verify
          - restore-test
          - backup
  schedule:
    # Check every two hours; minute 41 avoids the hourly scheduler spike.
    - cron: '41 */2 * * *'

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FLY_LOG_REDACT: |
    s/fdaa:[0-9a-fA-F:]+/[redacted-fly-private-ipv6]/g
    s/([Uu]pdating[[:space:]]+)[0-9a-fA-F]{12,}([[:space:]]+\[[^]]+\])/\1[redacted-fly-machine-id]\2/g
    s/(([Mm]achine[[:space:]]+[Ii][Dd][[:space:]]*:[[:space:]]*|[Mm]achine[[:space:]]+[Cc]onfig[[:space:]]+for[[:space:]]+|[Ll]ease[[:space:]]+for[[:space:]]+|[Mm]achine[[:space:]]+)(img_)?)[[:alnum:]_-]{12,}/\1[redacted-fly-machine-id]/g
    /[Mm]achine/ s/("(id|[Mm]achine[Ii][Dd])"[[:space:]]*:[[:space:]]*")[^"]+/\1[redacted-fly-machine-id]/g
    s/(([Ii]mage[[:space:]]+[Ii][Dd][[:space:]]*:[[:space:]]*|[Ii]mage[[:space:]]+)(img_)?)[[:alnum:]_-]{12,}/\1[redacted-fly-image-id]/g
    s/(img|app|vol|org|mach)_[[:alnum:]_-]+/[redacted-fly-id]/g
    /^[[:space:]]*[0-9a-fA-F]{8}[[:space:]]/ s/([[:space:]])[0-9a-fA-F]{12,}([[:space:]]|$)/\1[redacted-fly-machine-host]\2/g

concurrency:
  group: dependency_updates
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'none')
    runs-on: ubuntu-24.04
    # Bound the post-merge wait well below GitHub's default.
    timeout-minutes: 40
    # Scheduled updates merge automatically; manual runs opt in.
    env:
      AUTO_MERGE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.auto_merge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve the Vaultwarden base image
        id: base
        run: scripts/deps.sh base

      - name: Resolve supercronic
        id: tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/deps.sh tools

      - name: Compare the Dockerfile pins
        id: compare
        run: |
          scripts/deps.sh compare \
            VAULTWARDEN_VERSION="${{ steps.base.outputs.version }}" \
            VAULTWARDEN_DIGEST="${{ steps.base.outputs.digest }}" \
            SUPERCRONIC_VERSION="${{ steps.tools.outputs.supercronic_version }}" \
            SUPERCRONIC_SHA256_amd64="${{ steps.tools.outputs.supercronic_sha_amd64 }}" \
            SUPERCRONIC_SHA256_arm64="${{ steps.tools.outputs.supercronic_sha_arm64 }}"

      - name: Synchronize the Cloudflare IP ranges
        id: cloudflare
        run: python3 scripts/cloudflare_ranges.py sync --github-output "$GITHUB_OUTPUT"

      # Reject missing or malformed upstream results.
      - name: Decide whether dependency files changed
        id: changed
        run: |
          set -euo pipefail
          compare='${{ steps.compare.outputs.changed }}'
          cloudflare='${{ steps.cloudflare.outputs.changed }}'
          case "$compare" in true|false) ;; *) echo "invalid Dockerfile comparison result" >&2; exit 1 ;; esac
          case "$cloudflare" in true|false) ;; *) echo "invalid Cloudflare comparison result" >&2; exit 1 ;; esac
          if [ "$compare" = true ] || [ "$cloudflare" = true ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare the pinned base packages
        id: apk
        run: scripts/deps.sh apk "vaultwarden/server@${{ steps.base.outputs.digest }}"

      # The pinned base still lists an upgrade after our image applies it.
      - name: Compare packages in the published image
        id: published-apk
        if: >-
          success() &&
          github.event_name != 'workflow_run' &&
          steps.changed.outputs.changed != 'true' &&
          steps.apk.outputs.count != '0'
        continue-on-error: true
        run: scripts/deps.sh apk "${REGISTRY}/${IMAGE_NAME}:latest"

      - name: Update the pins and validate the build
        if: steps.changed.outputs.changed == 'true'
        run: |
          if [ '${{ steps.compare.outputs.changed }}' = true ]; then
            scripts/deps.sh apply \
              VAULTWARDEN_VERSION="${{ steps.base.outputs.version }}" \
              VAULTWARDEN_DIGEST="${{ steps.base.outputs.digest }}" \
              SUPERCRONIC_VERSION="${{ steps.tools.outputs.supercronic_version }}" \
              SUPERCRONIC_SHA256_amd64="${{ steps.tools.outputs.supercronic_sha_amd64 }}" \
              SUPERCRONIC_SHA256_arm64="${{ steps.tools.outputs.supercronic_sha_arm64 }}"
          fi
          docker build --tag dependency-check:local .
          docker run --rm --entrypoint caddy dependency-check:local \
            validate --config /Caddyfile --adapter caddyfile

      - name: Open the dependency PR
        id: pr
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.base.outputs.version }}
          DIGEST: ${{ steps.base.outputs.digest }}
          SUPERCRONIC: ${{ steps.tools.outputs.supercronic_version }}
          CLOUDFLARE_COUNT: ${{ steps.cloudflare.outputs.range_count }}
          CLOUDFLARE_IPV4: ${{ steps.cloudflare.outputs.ipv4_count }}
          CLOUDFLARE_IPV6: ${{ steps.cloudflare.outputs.ipv6_count }}
          CLOUDFLARE_CHANGED: ${{ steps.cloudflare.outputs.changed }}
          APK_COUNT: ${{ steps.apk.outputs.count }}
          APK_ROWS: ${{ steps.apk.outputs.rows }}
        run: |
          set -euo pipefail
          # One stable branch prevents stale dependency PRs from remaining armed.
          branch="deps/upstream"
          title="chore(deps): update upstream dependencies"
          body_file="${RUNNER_TEMP:-/tmp}/pr-body.md"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          {
            echo "Automated dependency check."
            echo
            echo "| Dependency | Pinned |"
            echo "| :--- | :--- |"
            echo "| vaultwarden/server | ${VERSION}-alpine @ ${DIGEST} |"
            echo "| supercronic | ${SUPERCRONIC} |"
            echo "| Cloudflare edge ranges | ${CLOUDFLARE_COUNT} (${CLOUDFLARE_IPV4} IPv4, ${CLOUDFLARE_IPV6} IPv6; changed: ${CLOUDFLARE_CHANGED}) |"
            echo
            echo "Alpine package updates available inside the base image (\`${APK_COUNT:-0}\`):"
            echo
            if [ "${APK_COUNT:-0}" -gt 0 ]; then
              echo "| Installed | Available |"
              echo "| :--- | :--- |"
              printf '%s\n' "$APK_ROWS" | awk 'NF {print "| `" $1 "` | `" $2 "` |"}'
            else
              echo "_No package upgrades are pending in the pinned base image._"
            fi
            echo
            echo "Merging rebuilds a timestamped image and rolls the new digest out to Fly automatically."
          } > "$body_file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add Dockerfile config/cloudflare_ips.caddy
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "chore(deps): update pinned upstream dependencies"
          git push --force origin "$branch"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Refresh an existing PR instead of misreading API errors as absence.
          open_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" \
            --state open --json number --jq 'length')"
          if [ "$open_pr" -gt 0 ]; then
            gh pr edit "$branch" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file "$body_file"
            echo "updated the existing open PR for ${branch}"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "$title" \
              --body-file "$body_file"
          fi
          echo "number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" \
            --state open --json number --jq '.[0].number // empty')" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN-created PR checks start as action_required; release the run
      # so the required validate check can register before auto-merge.
      - name: Release the held validate run
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 18); do
            id="$(timeout 30 gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&head_sha=${SHA}&per_page=20" \
              --jq '[.workflow_runs[] | select(.conclusion == "action_required")] | first | .id // empty')" || id=""
            if [ -n "$id" ]; then
              timeout 30 gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" >/dev/null
              echo "released the held pull_request run ${id}"
              exit 0
            fi
            sleep 10
          done
          echo "no held pull_request run appeared for ${SHA}" >&2
          exit 1

      - name: Arm auto-merge on the dependency PR
        id: arm
        if: steps.changed.outputs.changed == 'true' && env.AUTO_MERGE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail
          gh pr merge "$BRANCH" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --auto
          # Fail if the required check never registers.
          api_error=false
          for _ in $(seq 1 18); do
            registered=""
            if ! registered="$(gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" \
                --json statusCheckRollup --jq '.statusCheckRollup | length')"; then
              api_error=true
              echo "::warning::could not read the status checks for ${BRANCH}; retrying"
            else
              case "$registered" in
                ''|*[!0-9]*)
                  api_error=true
                  echo "::warning::could not read the status checks for ${BRANCH}; retrying"
                  ;;
                0) ;;
                *)
                  echo "auto-merge armed; ${registered} status check(s) registered on ${BRANCH}"
                  exit 0
                  ;;
              esac
            fi
            sleep 10
          done
          if [ "$api_error" = true ]; then
            echo "could not read the status checks for ${BRANCH} within 180s" >&2
          else
            echo "no status check registered on ${BRANCH} within 180s; the merge is still gated" >&2
          fi
          exit 1

      # A GITHUB_TOKEN merge does not trigger another workflow. Dispatch the build
      # only when this run performed the automatic merge.
      - name: Build and deploy after the merge
        if: >-
          always() &&
          steps.changed.outputs.changed == 'true' &&
          steps.pr.outcome == 'success' &&
          steps.arm.outcome == 'success' &&
          env.AUTO_MERGE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          [ -n "$NUMBER" ] || { echo "no dependency pull request number recorded" >&2; exit 1; }
          for _ in $(seq 1 40); do
            state="$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
            if [ "$state" = "MERGED" ]; then
              gh workflow run build_and_deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
              echo "dispatched the build for the merged dependency update"
              exit 0
            fi
            sleep 15
          done
          echo "pull request ${NUMBER} did not merge within 10 minutes" >&2
          exit 1

      # Package-only updates have no PR. Rebuild only while the published image
      # still contains pending upgrades.
      - name: Rebuild when only Alpine packages moved
        if: >-
          success() &&
          steps.changed.outputs.changed != 'true' &&
          steps.apk.outputs.count != '0' &&
          github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_COUNT: ${{ steps.apk.outputs.count }}
          PUBLISHED_APK_COUNT: ${{ steps.published-apk.outputs.count }}
          PUBLISHED_APK_OUTCOME: ${{ steps.published-apk.outcome }}
        run: |
          set -euo pipefail
          if [ "$PUBLISHED_APK_OUTCOME" != "success" ]; then
            echo "::error::could not inspect packages in the latest published image" >&2
            exit 1
          fi
          if scripts/deps.sh rebuild-needed "$APK_COUNT" "$PUBLISHED_APK_COUNT"; then
            gh workflow run build_and_deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi

  dependabot_automerge:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Arm auto-merge for the Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "invalid pull request number" >&2; exit 2 ;;
          esac

          # This write-capable event accepts only workflow/action pin changes.
          files="$(timeout 90 gh api --paginate \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
          [ -n "$files" ] || { echo "Dependabot PR has no changed files" >&2; exit 1; }
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/*.yml|.github/workflows/*.yaml|.github/actions/*/*.yml|.github/actions/*/*.yaml|.github/dependabot.yml) ;;
              *) echo "refusing auto-merge for unexpected path: ${file}" >&2; exit 1 ;;
            esac
          done <<< "$files"

          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" \
            --squash --delete-branch --auto

          # Fail if the required check never registers.
          api_error=false
          for _ in $(seq 1 18); do
            registered=""
            if ! registered="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" \
                --json statusCheckRollup --jq '.statusCheckRollup | length')"; then
              api_error=true
              echo "::warning::could not read the status checks for pull request ${PR_NUMBER}; retrying"
            else
              case "$registered" in
                ''|*[!0-9]*)
                  api_error=true
                  echo "::warning::could not read the status checks for pull request ${PR_NUMBER}; retrying"
                  ;;
                0) ;;
                *)
                  echo "auto-merge armed; ${registered} status check(s) registered"
                  exit 0
                  ;;
              esac
            fi
            sleep 10
          done
          if [ "$api_error" = true ]; then
            echo "could not read the status checks for pull request ${PR_NUMBER} within 180s" >&2
          else
            echo "no status check registered on Dependabot PR within 180s" >&2
          fi
          exit 1

  production_operation:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Run one fixed production operation
        id: operation
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}
          OPERATION: ${{ github.event.inputs.operation }}
        run: |
          set -euo pipefail
          : "${FLY_APP:?repository secret FLY_APP must hold the Fly app name}"
          case "$OPERATION" in
            audit)           command="/restic.sh audit" ;;
            check-freshness) command="/restic.sh check-freshness" ;;
            notify-test)     command="/restic.sh notify-test" ;;
            snapshots)       command="/restic.sh snapshots" ;;
            verify)          command="/restic.sh verify" ;;
            restore-test)    command="/restic.sh restore-test" ;;
            backup)          command="/restic.sh backup" ;;
            *)
              echo "::error::unsupported production operation" >&2
              exit 2
              ;;
          esac
          timeout 2400 flyctl ssh console --app "$FLY_APP" --command "$command" \
            2>&1 | sed -E "$FLY_LOG_REDACT"

  watchdog:
    # The app cannot report its own silence; this external job can.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Check the production backup heartbeat
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}
        run: |
          set -euo pipefail
          : "${FLY_APP:?repository secret FLY_APP must hold the Fly app name}"
          flyctl ssh console --app "$FLY_APP" --command "/restic.sh check-freshness" \
            2>&1 | sed -E "$FLY_LOG_REDACT"

  notify_failure:
    # Wait for every work job so the reported state is final.
    if: failure()
    needs:
      - check
      - dependabot_automerge
      - production_operation
      - watchdog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ secrets.FLY_APP }}
    steps:
      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Send the failure through Telegram
        env:
          WORKFLOW: ${{ github.workflow }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECK_RESULT: ${{ needs.check.result }}
          DEPENDABOT_RESULT: ${{ needs.dependabot_automerge.result }}
          OPERATION_RESULT: ${{ needs.production_operation.result }}
          WATCHDOG_RESULT: ${{ needs.watchdog.result }}
        run: |
          set -euo pipefail
          : "${FLY_API_TOKEN:?repository secret FLY_API_TOKEN must hold a Fly token}"
          : "${FLY_APP:?repository secret FLY_APP must hold the Fly app name}"

          # Reuse application secrets without copying them into GitHub.
          read_app_secret() {
            timeout 30 flyctl ssh console --quiet --app "$FLY_APP" \
              --command "printenv $1"
          }

          if ! token="$(read_app_secret TELEGRAM_BOT_TOKEN 2>/dev/null)"; then
            echo "::error::Could not read TELEGRAM_BOT_TOKEN from the app environment" >&2
            exit 1
          fi
          if ! chat_id="$(read_app_secret TELEGRAM_CHAT_ID 2>/dev/null)"; then
            echo "::error::Could not read TELEGRAM_CHAT_ID from the app environment" >&2
            exit 1
          fi

          case "$token" in
            ''|*[!0-9A-Za-z:_-]*)
              echo "::error::The app did not provide a usable Telegram bot token" >&2
              exit 1
              ;;
            *:*) ;;
            *)
              echo "::error::The app did not provide a usable Telegram bot token" >&2
              exit 1
              ;;
          esac
          case "$chat_id" in
            @*)
              case "${chat_id#@}" in
                ''|*[!A-Za-z0-9_]*)
                  echo "::error::The app did not provide a usable Telegram chat id" >&2
                  exit 1
                  ;;
              esac
              ;;
            -[0-9]*|[0-9]*)
              case "${chat_id#-}" in
                ''|*[!0-9]*)
                  echo "::error::The app did not provide a usable Telegram chat id" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::The app did not provide a usable Telegram chat id" >&2
              exit 1
              ;;
          esac
          echo "::add-mask::${token}"
          echo "::add-mask::${chat_id}"

          html_escape() {
            printf '%s' "$1" | sed \
              -e 's/&/\&amp;/g' \
              -e 's/</\&lt;/g' \
              -e 's/>/\&gt;/g'
          }
          workflow_name="$(html_escape "$WORKFLOW")"
          event_name="$(html_escape "$EVENT")"
          message="$(printf '<b>工作流失败</b>\n%s\n\n<b>任务状态</b>\n<code>check</code>: %s\n<code>dependabot_automerge</code>: %s\n<code>production_operation</code>: %s\n<code>watchdog</code>: %s\n\n<b>提交</b>: <code>%s</code>\n<b>事件</b>: <code>%s</code>\n\n<a href="%s">查看 Actions 运行详情</a>' \
            "$workflow_name" "$CHECK_RESULT" "$DEPENDABOT_RESULT" "$OPERATION_RESULT" "$WATCHDOG_RESULT" \
            "${SHA:0:12}" "$event_name" "$RUN_URL")"
          response_file="$(mktemp "${RUNNER_TEMP:-/tmp}/telegram-response.XXXXXX")"
          error_file="$(mktemp "${RUNNER_TEMP:-/tmp}/telegram-error.XXXXXX")"
          cleanup() {
            rm -f "$response_file" "$error_file"
          }
          trap cleanup EXIT

          set +e
          status="$(curl --silent --show-error --max-time 15 \
            --max-filesize 65536 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --data-urlencode "chat_id=${chat_id}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${message}" \
            --data-urlencode "disable_web_page_preview=true" \
            "https://api.telegram.org/bot${token}/sendMessage" 2>"$error_file")"
          rc=$?
          set -e

          redact_file() {
            local body
            body="$(head -c 4096 "$1")"
            body="${body//"$token"/<redacted>}"
            body="${body//"$chat_id"/<redacted>}"
            printf '%s' "$body"
          }

          if [ "$rc" -ne 0 ]; then
            detail="$(redact_file "$error_file")"
            echo "::error::Telegram failure alert transport failed (curl exit ${rc}): ${detail:-no diagnostic}" >&2
            exit 1
          fi
          if [ "$status" != "200" ]; then
            detail="$(redact_file "$response_file")"
            echo "::error::Telegram failure alert rejected (HTTP ${status}): ${detail:-no response body}" >&2
            exit 1
          fi
          if ! python3 -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); raise SystemExit(0 if isinstance(data, dict) and data.get("ok") is True else 1)' "$response_file"; then
            detail="$(redact_file "$response_file")"
            echo "::error::Telegram failure alert rejected (HTTP ${status}): ${detail:-no success response}" >&2
            exit 1
          fi
          echo "Telegram failure alert sent"
