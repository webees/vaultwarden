name: GHCR Cleanup
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Manual maintenance' || github.event.schedule == '17 3 * * *' && 'Nightly cleanup' || 'Dependency watchdog' }}

on:
  workflow_dispatch:
  schedule:
    # Offset from dependency checks so a delayed run still becomes a bounded override.
    - cron: '55 */2 * * *'
    # Keep the heavier registry cleanup nightly; off-hour minute avoids scheduler spikes.
    - cron: '17 3 * * *'

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  cleanup:
    if: github.event_name != 'schedule' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      # Serialize only the registry mutation with image builds.
      group: ghcr-registry
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Cleanup never pushes.
          persist-credentials: false

      - name: Remove stale Actions artifacts and build caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          # Build records are no longer uploaded. Every remaining dockerbuild
          # artifact is legacy and safe to remove regardless of age.
          artifacts="$(timeout 90 gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            | jq -r '
              .artifacts[]
              | select(.name | endswith(".dockerbuild"))
              | .id
            ')"
          caches="$(timeout 90 gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            | jq -r --arg cutoff "$cutoff" '
              .actions_caches[]
              | select(.last_accessed_at < $cutoff)
              | select(.key | test("^(buildkit-|index-buildkit-)"))
              | .id
            ')"
          for id in $artifacts; do
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || { echo "invalid artifact id" >&2; exit 1; }
            timeout 15 gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null
          done
          for id in $caches; do
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || { echo "invalid cache id" >&2; exit 1; }
            timeout 15 gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null
          done
          artifact_count="$(grep -c . <<< "$artifacts" || true)"
          cache_count="$(grep -c . <<< "$caches" || true)"
          echo "removed ${artifact_count} stale artifact(s) and ${cache_count} stale build cache(s)"

      - name: Cleanup GHCR
        uses: ./.github/actions/expire_tags
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ github.event.repository.name }}
          delete-untagged: true
          delete-broken: true

  dependency_watchdog:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '55 */2 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    concurrency:
      group: dependency-watchdog
      cancel-in-progress: false
    steps:
      - name: Check out automation checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Restart stale automations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          check_and_restart() {
            local workflow="$1" job="$2" max_age="$3" result
            set +e
            timeout 45 python3 scripts/ci/automation_health.py \
              --workflow "$workflow" --job "$job" --max-age "$max_age"
            result=$?
            set -e
            case "$result" in
              0) ;;
              3)
                timeout 60 gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
                echo "dispatched stale ${workflow}"
                ;;
              *)
                echo "::error::${workflow} schedule is failing or unavailable" >&2
                return 1
                ;;
            esac
          }
          check_and_restart build_and_deploy.yml rebuild_check 691200
          check_and_restart dependency_updates.yml check 64800
