name: GHCR Cleanup

on:
  workflow_dispatch:
  schedule:
    # Minute 17 avoids the hourly scheduler spike.
    - cron: '17 3 * * *'

permissions:
  actions: write
  contents: read
  packages: write

concurrency:
  # Serialize with image builds.
  group: ghcr-registry
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Cleanup never pushes.
          persist-credentials: false

      - name: Remove stale Actions artifacts and build caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          # Build records are no longer uploaded. Every remaining dockerbuild
          # artifact is legacy and safe to remove regardless of age.
          artifacts="$(timeout 90 gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            | jq -r '
              .artifacts[]
              | select(.name | endswith(".dockerbuild"))
              | .id
            ')"
          caches="$(timeout 90 gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            | jq -r --arg cutoff "$cutoff" '
              .actions_caches[]
              | select(.last_accessed_at < $cutoff)
              | select(.key | test("^(buildkit-|index-buildkit-)"))
              | .id
            ')"
          for id in $artifacts; do
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || { echo "invalid artifact id" >&2; exit 1; }
            timeout 15 gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null
          done
          for id in $caches; do
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || { echo "invalid cache id" >&2; exit 1; }
            timeout 15 gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null
          done
          artifact_count="$(grep -c . <<< "$artifacts" || true)"
          cache_count="$(grep -c . <<< "$caches" || true)"
          echo "removed ${artifact_count} stale artifact(s) and ${cache_count} stale build cache(s)"

      - name: Cleanup GHCR
        uses: ./.github/actions/expire_tags
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ github.event.repository.name }}
          delete-untagged: true
          delete-broken: true

  dependency_watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    concurrency:
      group: dependency-watchdog
      cancel-in-progress: false
    steps:
      - name: Restart a stale dependency check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_AGE_SECONDS: 21600
        run: |
          set -euo pipefail
          [[ "$MAX_AGE_SECONDS" =~ ^[1-9][0-9]*$ ]] || { echo "invalid dependency age limit" >&2; exit 1; }
          runs="$(timeout 30 gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/dependency_updates.yml/runs?per_page=20")"
          active="$(jq -r '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length' <<< "$runs")"
          if [ "$active" -gt 0 ]; then
            echo "dependency check already active: ${active} run(s)"
            exit 0
          fi
          latest="$(jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].created_at // empty' <<< "$runs")"
          stale=false
          if [ -z "$latest" ]; then
            stale=true
          else
            age=$(( $(date -u +%s) - $(date -u -d "$latest" +%s) ))
            echo "last successful dependency check: ${latest} (${age}s ago)"
            [ "$age" -lt "$MAX_AGE_SECONDS" ] || stale=true
          fi
          if [ "$stale" = true ]; then
            timeout 60 gh workflow run dependency_updates.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "dispatched a stale dependency check"
          fi
