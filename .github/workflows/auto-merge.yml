name: 🤖 Auto-merge Dependency PRs

on:
  workflow_run:
    workflows:
      - ✅ Pull Request Validation
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: 🔀 Squash-merge the dependency PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.workflow_run.head_repository.full_name }}" != "$GITHUB_REPOSITORY" ]; then
            echo "Refusing to merge a fork PR" >&2
            exit 0
          fi
          case "$HEAD_BRANCH" in
            deps/upstream-*)
              gh pr merge "$HEAD_BRANCH" --repo "$GITHUB_REPOSITORY" \
                --squash --delete-branch
              ;;
            *)
              echo "Not a dependency branch: ${HEAD_BRANCH}"
              ;;
          esac
