name: 🤖 Auto-merge Dependency PRs

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch of the dependency PR to merge"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - name: 🔀 Squash-merge the dependency PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          case "$HEAD_BRANCH" in
            deps/upstream-*)
              gh pr merge "$HEAD_BRANCH" --repo "$GITHUB_REPOSITORY" \
                --squash --delete-branch
              ;;
            *)
              echo "Not a dependency branch: ${HEAD_BRANCH}"
              ;;
          esac
